<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrobo AI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- JSZip & FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <!-- Marked -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Fira+Code:wght@400;500&display=swap');

        body {
            font-family: 'Heebo', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Typing Animation */
        .typing-indicator span {
            display: inline-block;
            width: 6px; height: 6px;
            background-color: #60a5fa;
            border-radius: 50%;
            animation: typing 1.4s infinite both;
            margin: 0 2px;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Code Editor Style */
        textarea.code-editor {
            background-color: #1e1e1e;
            color: #d4d4d4;
            resize: none; outline: none;
            font-family: 'Fira Code', monospace;
            line-height: 1.5;
            tab-size: 2;
        }
        
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px; height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shadow-lg z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/30">
                <i class="fa-brands fa-chrome text-white text-xl"></i>
            </div>
            <!-- Clean Title Request -->
            <h1 class="text-2xl font-bold text-white tracking-wide">Chrobo AI</h1>
        </div>
        
        <div class="flex items-center gap-4">
            <div id="api-status" class="hidden items-center gap-2 px-3 py-1 rounded-full bg-green-500/10 border border-green-500/30 text-green-400 text-xs font-medium">
                <i class="fa-solid fa-check-circle"></i> מחובר
            </div>
            <button onclick="window.openSettings()" class="p-2 text-slate-400 hover:text-white transition-colors" title="הגדרות">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Settings Modal -->
        <div id="api-modal" class="hidden absolute inset-0 z-50 bg-slate-900/95 flex items-center justify-center backdrop-blur-sm">
            <div class="bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl max-w-md w-full mx-4 text-center">
                <div class="w-16 h-16 bg-blue-500/10 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h2 class="text-2xl font-bold mb-2 text-white">הגדרת מפתח API</h2>
                <p class="text-slate-400 mb-6 text-sm">הכנס מפתח Google AI Studio עבור <b>gemini-3-pro-preview</b></p>
                
                <div class="relative mb-4">
                    <input type="password" id="api-key-input" placeholder="הדבק מפתח כאן..." 
                        class="w-full bg-slate-900 border border-slate-600 text-white py-3 px-4 rounded-xl focus:border-blue-500 outline-none text-sm dir-ltr text-left">
                </div>
                
                <div id="validation-msg" class="h-6 mb-2 text-sm"></div>

                <button onclick="window.validateAndSaveKey()" id="save-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                    אמת ושמור
                </button>
                <button onclick="window.closeSettings()" class="mt-3 text-slate-500 text-sm hover:text-slate-300 underline">
                    סגור (אם כבר קיים מפתח)
                </button>
            </div>
        </div>

        <!-- Chat Panel -->
        <div class="w-full md:w-1/3 flex flex-col border-l border-slate-800 bg-slate-900/50">
            <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 scroll-smooth">
                <div class="flex flex-col items-start">
                    <div class="bg-slate-800 p-4 rounded-2xl rounded-tr-none border border-slate-700 max-w-[90%]">
                        <div class="flex items-center gap-2 mb-2 text-blue-400 font-bold text-sm">
                            <i class="fa-solid fa-robot"></i> Chrobo AI
                        </div>
                        <p class="text-slate-300 text-sm">
                            שלום! אני Chrobo AI. <br>
                            אני מוכן לבנות עבורך תוספי כרום באמצעות המודל החדש.
                        </p>
                    </div>
                </div>
            </div>

            <div class="p-4 bg-slate-900 border-t border-slate-800">
                <div class="relative">
                    <textarea id="user-prompt" rows="2" placeholder="תאר את התוסף..." 
                        class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 pl-12 focus:border-blue-500 outline-none resize-none text-sm"></textarea>
                    <button onclick="window.sendMessage()" id="send-btn" class="absolute left-2 bottom-2 p-2 text-blue-400 hover:bg-blue-900/30 rounded-lg transition-colors">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Code Editor Panel -->
        <div class="flex-1 flex flex-col bg-[#1e1e1e]">
            <div class="h-12 bg-[#252526] flex items-center justify-between px-4 border-b border-[#3e3e42]">
                <div class="flex overflow-x-auto hide-scrollbar gap-1" id="file-tabs">
                    <span class="text-xs text-gray-500 p-2 italic">אין קבצים</span>
                </div>
                <button onclick="window.downloadZip()" id="dl-btn" class="flex items-center gap-2 bg-green-700 hover:bg-green-600 text-white text-xs px-3 py-1.5 rounded opacity-50 cursor-not-allowed" disabled>
                    <i class="fa-solid fa-file-zipper"></i> הורד ZIP
                </button>
            </div>

            <div class="flex-1 relative">
                <textarea id="code-display" class="code-editor w-full h-full p-6" spellcheck="false" readonly></textarea>
                <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-slate-600 pointer-events-none">
                    <i class="fa-solid fa-code text-4xl mb-4 opacity-20"></i>
                    <p class="text-sm opacity-50">הקוד יופיע כאן</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global State
        const GEMINI_MODEL = 'gemini-3-pro-preview';
        let apiKey = localStorage.getItem('chrobo_api_key') || '';
        let currentFiles = {};
        let activeFile = null;
        let chatHistory = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            if (!apiKey) {
                window.openSettings();
            } else {
                document.getElementById('api-status').classList.replace('hidden', 'flex');
            }
        });

        // --- Global Functions (attached to window to prevent ReferenceError) ---

        window.openSettings = function() {
            const modal = document.getElementById('api-modal');
            const input = document.getElementById('api-key-input');
            input.value = apiKey;
            modal.classList.remove('hidden');
            document.getElementById('validation-msg').innerHTML = '';
        };

        window.closeSettings = function() {
            document.getElementById('api-modal').classList.add('hidden');
        };

        window.validateAndSaveKey = async function() {
            const input = document.getElementById('api-key-input');
            const btn = document.getElementById('save-btn');
            const msgDiv = document.getElementById('validation-msg');
            const key = input.value.trim();

            if (!key) {
                msgDiv.innerHTML = '<span class="text-red-400">נא להזין מפתח</span>';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div>';
            msgDiv.innerHTML = '';

            try {
                // Test connection to gemini-3-pro-preview
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Test" }] }]
                    })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error?.message || 'Error');
                }

                // Success
                apiKey = key;
                localStorage.setItem('chrobo_api_key', apiKey);
                msgDiv.innerHTML = '<span class="text-green-400">המפתח תקין!</span>';
                
                document.getElementById('api-status').classList.replace('hidden', 'flex');
                
                setTimeout(() => {
                    window.closeSettings();
                    btn.disabled = false;
                    btn.innerHTML = 'אמת ושמור';
                }, 1000);

            } catch (e) {
                console.error(e);
                msgDiv.innerHTML = `<span class="text-red-400 text-xs">שגיאה: המפתח לא תקין או אין גישה למודל.</span>`;
                btn.disabled = false;
                btn.innerHTML = 'אמת ושמור';
            }
        };

        window.sendMessage = async function() {
            const input = document.getElementById('user-prompt');
            const text = input.value.trim();
            
            if (!text) return;
            if (!apiKey) {
                window.openSettings();
                return;
            }

            // UI Updates
            input.value = '';
            addChatBubble('user', text);
            const loadingId = showLoading();
            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;

            // System Prompt
            const systemPrompt = `
            You are Chrobo AI, a Chrome Extension expert.
            Model: ${GEMINI_MODEL}.
            Output: STRICT JSON ONLY. No markdown code blocks.
            Structure:
            {
                "message": "Hebrew explanation of what you did.",
                "files": [
                    { "name": "manifest.json", "content": "..." },
                    { "name": "popup.html", "content": "..." }
                ]
            }
            Manifest Version must be 3.
            `;

            const contents = [
                { role: "user", parts: [{ text: systemPrompt }] },
                ...chatHistory,
                { role: "user", parts: [{ text: text }] }
            ];

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: contents,
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);

                const rawText = data.candidates[0].content.parts[0].text;
                const parsed = JSON.parse(rawText);

                // Update History
                chatHistory.push({ role: "user", parts: [{ text }] });
                chatHistory.push({ role: "model", parts: [{ text: rawText }] });

                // Update UI
                removeLoading(loadingId);
                addChatBubble('model', parsed.message);
                
                if (parsed.files && parsed.files.length) {
                    updateFiles(parsed.files);
                }

            } catch (e) {
                removeLoading(loadingId);
                addChatBubble('model', `שגיאה: ${e.message}`);
            } finally {
                sendBtn.disabled = false;
            }
        };

        window.downloadZip = function() {
            const zip = new JSZip();
            Object.keys(currentFiles).forEach(name => zip.file(name, currentFiles[name]));
            zip.generateAsync({type:"blob"}).then(content => saveAs(content, "extension.zip"));
        };

        // --- Internal Helper Functions ---

        function addChatBubble(role, text) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `flex flex-col ${role === 'user' ? 'items-end' : 'items-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = role === 'user' 
                ? 'bg-blue-600 text-white p-3 rounded-2xl rounded-tl-none max-w-[90%] text-sm'
                : 'bg-slate-800 border border-slate-700 text-slate-200 p-3 rounded-2xl rounded-tr-none max-w-[90%] text-sm';
            
            if (role === 'model') {
                bubble.innerHTML = marked.parse(text);
            } else {
                bubble.textContent = text;
            }

            div.appendChild(bubble);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function showLoading() {
            const id = 'loading-' + Date.now();
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex flex-col items-start';
            div.innerHTML = `
                <div class="bg-slate-800 p-3 rounded-2xl rounded-tr-none border border-slate-700">
                    <div class="typing-indicator flex gap-1"><span></span><span></span><span></span></div>
                </div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function updateFiles(newFiles) {
            newFiles.forEach(f => currentFiles[f.name] = f.content);
            renderTabs();
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('dl-btn').disabled = false;
            document.getElementById('dl-btn').classList.remove('opacity-50', 'cursor-not-allowed');
            
            if (!activeFile || newFiles.some(f => f.name === activeFile)) {
                selectFile(newFiles[0].name);
            }
        }

        function renderTabs() {
            const container = document.getElementById('file-tabs');
            container.innerHTML = '';
            
            Object.keys(currentFiles).forEach(name => {
                const btn = document.createElement('button');
                const isActive = activeFile === name;
                btn.className = `px-3 py-2 text-xs border-t-2 flex items-center gap-2 transition-colors
                    ${isActive ? 'bg-[#1e1e1e] text-white border-blue-500' : 'bg-[#2d2d2d] text-gray-400 border-transparent hover:bg-[#252526]'}`;
                
                let icon = 'fa-file';
                if (name.endsWith('html')) icon = 'fa-html5 text-orange-500';
                if (name.endsWith('js')) icon = 'fa-js text-yellow-400';
                if (name.endsWith('css')) icon = 'fa-css3 text-blue-400';
                if (name.endsWith('json')) icon = 'fa-gear text-gray-400';

                btn.innerHTML = `<i class="fa-brands ${icon}"></i> ${name}`;
                btn.onclick = () => selectFile(name);
                container.appendChild(btn);
            });
        }

        function selectFile(name) {
            activeFile = name;
            renderTabs();
            const editor = document.getElementById('code-display');
            editor.value = currentFiles[name];
            editor.readOnly = false;
            editor.oninput = (e) => currentFiles[name] = e.target.value;
        }

        // Allow Enter to send
        document.getElementById('user-prompt').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                window.sendMessage();
            }
        });

    </script>
</body>
</html>
